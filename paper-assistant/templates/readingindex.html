<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>论文阅读助手 - AI学术助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #667eea; font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 1.1em; }
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-left: 10px;
        }
        .search-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .search-box {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .search-input {
            flex: 1;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-small { padding: 8px 16px; font-size: 14px; }
        .btn-outline {
            background: transparent;
            border: 2px solid #667eea;
            color: #667eea;
        }
        .btn-outline:hover {
            background: #667eea;
            color: white;
        }
        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
            align-items: center;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .filter-group label { font-weight: 500; }
        select, input[type="number"] {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 30px;
        }
        .papers-list {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            max-height: 600px;
            overflow-y: auto;
        }
        .paper-card {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }
        .paper-card:hover {
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transform: translateX(5px);
        }
        .new-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff4757;
            color: white;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.7em;
            font-weight: bold;
        }
        .paper-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
            padding-right: 50px;
        }
        .paper-authors {
            color: #666;
            font-size: 0.85em;
            margin-bottom: 8px;
        }
        .paper-summary {
            color: #888;
            font-size: 0.85em;
            line-height: 1.5;
            margin-bottom: 8px;
        }
        .paper-meta {
            display: flex;
            gap: 15px;
            font-size: 0.8em;
            color: #999;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .card h3 {
            margin-bottom: 15px;
            color: #667eea;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .qa-section {
            max-height: 300px;
            overflow-y: auto;
        }
        .qa-item {
            margin-bottom: 15px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 10px;
        }
        .qa-question {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        .qa-answer {
            color: #555;
            font-size: 0.85em;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .question-input {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .quick-btn {
            padding: 5px 12px;
            background: #f0f0f0;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.2s;
        }
        .quick-btn:hover {
            background: #667eea;
            color: white;
        }
        .trend-item {
            padding: 8px;
            margin: 5px 0;
            background: #f9f9f9;
            border-radius: 5px;
            font-size: 0.85em;
        }
        .review-content {
            max-height: 400px;
            overflow-y: auto;
            font-size: 0.85em;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
        @media (max-width: 768px) {
            .main-content { grid-template-columns: 1fr; }
            .search-box { flex-direction: column; }
            h1 { font-size: 1.8em; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .paper-card { animation: fadeIn 0.3s ease-out; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 论文阅读助手 <span class="badge">AI驱动 | 智能追踪 | 创新分析</span></h1>
            <p class="subtitle">智能论文追踪 | 创新点分析 | 文献综述生成 | 深度问答</p>
        </div>
        
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchQuery" class="search-input" placeholder="输入搜索关键词，例如：deep learning, transformer, GPT..." value="artificial intelligence">
                <button class="btn" onclick="searchPapers()">🔍 搜索论文</button>
            </div>
            
            <div class="filters">
                <div class="filter-group">
                    <label>🎯 关注领域:</label>
                    <select id="fieldSelect">
                        <option value="cs.AI">🤖 人工智能 (AI)</option>
                        <option value="cs.CV">👁️ 计算机视觉 (CV)</option>
                        <option value="cs.CL">💬 自然语言处理 (NLP)</option>
                        <option value="cs.LG">📊 机器学习 (ML)</option>
                        <option value="cs.RO">🤖 机器人 (Robotics)</option>
                    </select>
                    <button class="btn-small" onclick="getLatestPapers()">📅 获取最新论文</button>
                    <button class="btn-small" onclick="getMyFeed()">🔔 我的订阅</button>
                </div>
                <div class="filter-group">
                    <label>排序:</label>
                    <select id="sortBy">
                        <option value="relevance">相关性</option>
                        <option value="date">最新发表</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>数量:</label>
                    <input type="number" id="maxResults" value="15" min="1" max="30">
                </div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="papers-list" id="papersList">
                <div class="loading">✨ 点击搜索开始探索学术世界...</div>
            </div>
            
            <div class="sidebar">
                <div class="card">
                    <h3>💬 AI智能问答</h3>
                    <div class="quick-buttons">
                        <button class="quick-btn" onclick="quickQuestion('推荐一篇论文')">推荐论文</button>
                        <button class="quick-btn" onclick="quickQuestion('总结这篇论文')">论文总结</button>
                        <button class="quick-btn" onclick="quickQuestion('创新点分析')">创新点分析</button>
                        <button class="quick-btn" onclick="quickQuestion('研究趋势')">研究趋势</button>
                        <button class="quick-btn" onclick="quickQuestion('生成文献综述')">文献综述</button>
                    </div>
                    <div id="qaHistory" class="qa-section">
                        <div class="qa-item">
                            <div class="qa-question">🤖 助手提示</div>
                            <div class="qa-answer">我可以帮您：\n✅ 推荐论文\n✅ 总结内容\n✅ 分析创新点\n✅ 生成文献综述\n✅ 分析研究趋势\n\n试试点击上面的快捷按钮！</div>
                        </div>
                    </div>
                    <input type="text" id="questionInput" class="question-input" placeholder="输入您的问题..." 
                           onkeypress="if(event.keyCode==13) askQuestion()">
                    <button class="btn" onclick="askQuestion()" style="margin-top: 10px; width: 100%">💡 智能提问</button>
                </div>
                
                <div class="card">
                    <h3>📊 研究趋势</h3>
                    <div id="trendsContent">
                        <button class="btn" onclick="analyzeTrends()" style="width: 100%">分析趋势</button>
                    </div>
                </div>
                
                <div class="card">
                    <h3>📝 文献综述</h3>
                    <input type="text" id="topicInput" class="question-input" placeholder="输入研究主题" value="人工智能">
                    <button class="btn" onclick="generateReview()" style="margin-top: 10px; width: 100%">生成综述</button>
                    <div id="reviewContent" class="review-content" style="margin-top: 15px;"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let currentPapers = [];
        let selectedPaper = null;
        
        async function searchPapers() {
            const query = document.getElementById('searchQuery').value;
            const maxResults = document.getElementById('maxResults').value;
            const sortBy = document.getElementById('sortBy').value;
            
            showLoading('papersList');
            
            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        query: query,
                        max_results: parseInt(maxResults),
                        sort_by: sortBy
                    })
                });
                
                const data = await response.json();
                currentPapers = data.papers;
                displayPapers(data.papers);
            } catch (error) {
                document.getElementById('papersList').innerHTML = '<div class="loading">❌ 搜索失败，请重试</div>';
            }
        }
        
        async function getLatestPapers() {
            const field = document.getElementById('fieldSelect').value;
            showLoading('papersList');
            
            try {
                const response = await fetch('/api/latest', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({field: field, days: 7})
                });
                
                const data = await response.json();
                currentPapers = data.papers;
                displayPapers(data.papers, true);
                addToQAHistory('系统', `✅ 已获取 ${data.field} 领域过去7天的最新论文，共 ${data.count} 篇`);
            } catch (error) {
                document.getElementById('papersList').innerHTML = '<div class="loading">❌ 获取失败</div>';
            }
        }
        
        async function getMyFeed() {
            showLoading('papersList');
            
            try {
                const response = await fetch('/api/my-feed', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({})
                });
                
                const data = await response.json();
                currentPapers = data.papers;
                displayPapers(data.papers, true);
                addToQAHistory('系统', `🔔 您订阅的领域最新论文，共 ${data.count} 篇`);
            } catch (error) {
                document.getElementById('papersList').innerHTML = '<div class="loading">❌ 获取失败</div>';
            }
        }
        
        function displayPapers(papers, showNewBadge = false) {
            const container = document.getElementById('papersList');
            
            if (!papers || papers.length === 0) {
                container.innerHTML = '<div class="loading">😔 没有找到相关论文</div>';
                return;
            }
            
            container.innerHTML = papers.map(paper => `
                <div class="paper-card" onclick="selectPaper(${JSON.stringify(paper).replace(/"/g, '&quot;')})">
                    ${paper.is_new && showNewBadge ? '<div class="new-badge">🆕 最新</div>' : ''}
                    <div class="paper-title">📄 ${paper.title}</div>
                    <div class="paper-authors">✍️ ${paper.authors.slice(0, 3).join(', ')}${paper.authors.length > 3 ? ' et al.' : ''}</div>
                    <div class="paper-summary">${paper.summary.substring(0, 180)}...</div>
                    <div class="paper-meta">
                        <span>📅 ${paper.published}</span>
                        <span>🔗 <a href="${paper.pdf_url}" target="_blank" onclick="event.stopPropagation()">PDF链接</a></span>
                    </div>
                </div>
            `).join('');
        }
        
        function selectPaper(paper) {
            selectedPaper = paper;
            addToQAHistory('您', `选择了论文: ${paper.title}`);
            
            // 自动总结
            fetch('/api/summarize', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({content: paper.summary, title: paper.title})
            })
            .then(res => res.json())
            .then(data => {
                addToQAHistory('助手', data.summary);
            })
            .catch(err => {
                addToQAHistory('助手', `📄 已选择：《${paper.title}》\n\n${paper.summary.substring(0, 400)}...`);
            });
        }
        
        function quickQuestion(type) {
            let question = type;
            if (type === '创新点分析' && selectedPaper) {
                analyzeInnovation();
                return;
            }
            if (type === '总结这篇论文' && selectedPaper) {
                question = '总结这篇论文';
            }
            document.getElementById('questionInput').value = question;
            askQuestion();
        }
        
        async function analyzeInnovation() {
            if (!selectedPaper) {
                addToQAHistory('助手', '请先点击选择一篇论文');
                return;
            }
            
            addToQAHistory('您', '创新点分析');
            
            try {
                const response = await fetch('/api/innovation', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({content: selectedPaper.summary, title: selectedPaper.title})
                });
                const data = await response.json();
                addToQAHistory('助手', data.innovation);
            } catch (error) {
                addToQAHistory('助手', '分析失败，请重试');
            }
        }
        
        async function askQuestion() {
            const question = document.getElementById('questionInput').value;
            if (!question.trim()) return;
            
            addToQAHistory('您', question);
            document.getElementById('questionInput').value = '';
            
            try {
                const response = await fetch('/api/question', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({question: question})
                });
                
                const data = await response.json();
                addToQAHistory('助手', data.answer);
            } catch (error) {
                addToQAHistory('助手', '抱歉，我暂时无法回答问题。请稍后重试。');
            }
        }
        
        async function generateReview() {
            const topic = document.getElementById('topicInput').value;
            const reviewDiv = document.getElementById('reviewContent');
            reviewDiv.innerHTML = '<div class="loading">📝 生成综述中...</div>';
            
            try {
                const response = await fetch('/api/literature-review', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({topic: topic})
                });
                const data = await response.json();
                reviewDiv.innerHTML = `<div class="review-content">${data.review.replace(/\n/g, '<br>')}</div>`;
                addToQAHistory('系统', `✅ 已生成关于《${topic}》的文献综述`);
            } catch (error) {
                reviewDiv.innerHTML = '<div class="loading">❌ 生成失败</div>';
            }
        }
        
        async function analyzeTrends() {
            const container = document.getElementById('trendsContent');
            container.innerHTML = '<div class="loading">📊 分析中...</div>';
            
            try {
                const response = await fetch('/api/trends', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({})
                });
                
                const trends = await response.json();
                
                container.innerHTML = `
                    <div class="trend-item">🔥 热门主题: ${trends.hot_topics?.join(', ') || '暂无'}</div>
                    <div class="trend-item">💡 新兴领域: ${trends.emerging_fields?.join(', ') || '暂无'}</div>
                    <div class="trend-item">📈 ${trends.publication_trend || '暂无数据'}</div>
                    <button class="btn" onclick="analyzeTrends()" style="margin-top: 15px; width: 100%">刷新分析</button>
                `;
            } catch (error) {
                container.innerHTML = '<div class="loading">❌ 分析失败</div>';
            }
        }
        
        function addToQAHistory(role, message) {
            const container = document.getElementById('qaHistory');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'qa-item';
            messageDiv.innerHTML = `
                <div class="qa-question">${role === '您' ? '👤 您' : '🤖 助手'}</div>
                <div class="qa-answer">${message.replace(/\n/g, '<br>')}</div>
            `;
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
            
            while (container.children.length > 20) {
                container.removeChild(container.firstChild);
            }
        }
        
        function showLoading(elementId) {
            document.getElementById(elementId).innerHTML = '<div class="loading">加载中...</div>';
        }
        
        window.addEventListener('load', () => {
            searchPapers();
        });
    </script>
</body>
</html>
